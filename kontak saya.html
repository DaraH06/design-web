<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;

        }
        nav {
            background-color: #333;

        a {
            color: #007BFF;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input, textarea {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;

<body>

    <section id="contact">

        <h3>Kirim Pesan</h3>

    <script>
        function SendToWhatsapp(event) {
            event.preventDefault();
            
            // Ambil nilai input
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let pesan = document.getElementById("Pesan").value;
            

            let whatsappPesan = `Nama: ${name}%0AEmail: ${email}%0A%0A"${pesan}"`;
            let phoneNumber = "6282143251748";
            let whatsappURL = `https://api.whatsapp.com/send/?phone=${phoneNumber}&text=${whatsappPesan}&type=phone_number&app_absent=0`;
            
            window.open(whatsappURL, "_blank");
